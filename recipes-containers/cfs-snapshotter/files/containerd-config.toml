# containerd configuration for the cfs snapshotter: registers the cfs
# snapshotter and differ served by containerd-cfs-grpc. Same settings as
# docs/containerd-cfs.toml in cfs-snapshotter v0.4.1; keep them in sync.

version = 2

# Register the cfs proxy snapshotter (address must match the daemon).
[proxy_plugins.cfs]
  type = "snapshot"
  address = "/run/containerd-cfs-grpc/containerd-cfs-grpc.sock"

# Required: without this export, transfer-service pulls do not stamp the
# image identity the cfs admission gate needs, and are declined.
[proxy_plugins.cfs.exports]
  enable_remote_snapshot_annotations = "true"

# Register the cfs differ, served by the same daemon on the same socket.
# It ingests the layers of a staged pull straight into the ocicfs store;
# without it every staged pull fails at the layer apply.
[proxy_plugins.cfs-diff]
  type = "diff"
  address = "/run/containerd-cfs-grpc/containerd-cfs-grpc.sock"

# Docker applies layers through the diff service, which tries the differs
# in this order: cfs-diff takes the cfs snapshotter's layers and declines
# every other, which then falls through to walking as before.
[plugins."io.containerd.service.v1.diff-service"]
  default = ["cfs-diff", "walking"]

# `ctr pull` unpacks via the transfer service, which only unpacks for the
# snapshotters listed here. Listing any entry replaces the built-in
# default, so keep overlayfs alongside cfs.
[[plugins."io.containerd.transfer.v1.local".unpack_config]]
  platform = "linux"
  snapshotter = "overlayfs"

[[plugins."io.containerd.transfer.v1.local".unpack_config]]
  platform = "linux"
  snapshotter = "cfs"
  differ = "cfs-diff"
